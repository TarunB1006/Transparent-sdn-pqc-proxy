[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transparent-sdn-pqc-proxy"
version = "1.0.0"
description = "Transparent post-quantum proxy for the SDN (OpenFlow) control channel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tarun Bhupathi" },
    { name = "Sravya D" },
    { name = "Varsha V P" },
    { name = "Sneha M" },
]
dependencies = [
    "cryptography>=42.0.0",
    "prometheus-client>=0.20.0",
    "PyYAML>=6.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
pqc = ["liboqs-python>=0.10.0"]
sdn = ["ryu>=4.34", "networkx>=3.0", "eventlet>=0.35.0"]
dev = ["pytest>=8.0", "pytest-cov>=4.0"]
research = ["matplotlib>=3.8", "numpy>=1.26"]
all = ["pqc-sdn-platform[pqc,sdn,dev,research]"]

[project.scripts]
pqc-proxy = "pqc_sdn.apps.proxy:main"
pqc-metrics = "pqc_sdn.apps.metrics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
